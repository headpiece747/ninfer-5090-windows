name: Windows Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup CUDA
      uses: Jimver/cuda-toolkit@v0.2.16
      with:
        cuda: '12.6.0'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download and Extract FFmpeg
      shell: powershell
      run: |
        Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip' -OutFile 'ffmpeg.zip'
        Expand-Archive -Path 'ffmpeg.zip' -DestinationPath 'ffmpeg_temp' -Force
        Move-Item -Path 'ffmpeg_temp\ffmpeg-master-latest-win64-gpl-shared' -Destination 'ffmpeg'
        Remove-Item -Recurse -Force 'ffmpeg_temp'
        Remove-Item 'ffmpeg.zip'

    - name: Configure CMake
      run: cmake -B build -S . -G Ninja -DCMAKE_CUDA_ARCHITECTURES="120a" -DNINFER_ENABLE_AVX2=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Copy FFmpeg DLLs
      shell: powershell
      run: |
        Copy-Item ffmpeg\bin\*.dll build\apps\ -Force

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ninfer-windows-binaries
        path: |
          build/apps/ninfer-serve.exe
          build/apps/ninfer.exe
          build/apps/*.dll
          start_ninfer_5090.bat
          start_ninfer_vision.bat
