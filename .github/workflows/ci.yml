# The checks that need no GPU, on every push and pull request.
#
# It runs the same script a commit runs (.githooks/pre-commit) rather than restating its commands, so
# there is one definition of what the fast gates are and CI cannot drift from the hook. The hook's
# commands are: documentation links resolve, the profile tables match the module and the generated
# launchers, the converter tests pass, ruff is clean, and mypy is clean.
#
# windows-latest because the tooling is Windows-first: the recipes are .cmd, the profile matrix looks
# for engines at build\apps, and check_profile_consistency finds the opencode provider entries under
# %USERPROFILE%\.config\opencode (absent on CI, which it reports as skipped rather than failing).
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  fast-gates:
    runs-on: windows-latest
    steps:
      # core.autocrlf is true on these runners, and it wins over .gitattributes for the *commit* path:
      # git normalizes to LF and re-expands on checkout, so the checked-out launcher differs from the
      # bytes the table renders in-process -- 157 lines both sides, 63 bytes apart. The gates compare
      # generated files byte-for-byte, so the checkout is asked to reproduce the repository's own bytes
      # rather than this runner's convention. This is the fix actions/checkout#135 points at.
      - uses: actions/checkout@v4
        with:
          # No conversion on this checkout: the repository's stored bytes are what the gates compare.
          # `git config` rather than the action, because core.autocrlf also governs the merge and
          # status paths the diagnostic step reports on.
          config: |
            core.autocrlf=false
            core.eol=lf

      # The launcher comparison failed here by 63 bytes on all eight files while passing locally, and
      # three diagnoses on this side were wrong: the render is byte-identical to the checkout under both
      # 3.12 and 3.11 with this worktree's bytes. So the remaining variable is what this runner checks
      # out and what its git does with line endings. These lines print the runner's own view -- attribute,
      # config, checked-out size and the render's size and CRLF count -- so the next failure identifies
      # itself instead of being guessed at. Remove once the comparison is understood.
      - name: diagnostics (temporary)
        run: |
          git ls-files --eol start_quasar_v3_dflash2_vision.bat
          git config --get core.autocrlf
          python -c "import sys,pathlib; sys.path.insert(0,'tools/release'); import make_launchers_v3 as m, profiles; t=m.render(profiles.PROFILES[0]); b=t.encode(); d=pathlib.Path(profiles.PROFILES[0]['file']).read_bytes(); print('render', len(b), 'crlf', t.count(chr(13)+chr(10)), 'disk', len(d), 'crlf', d.count(b'\r\n')); print('equal', d == b)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The converter tests import torch and safetensors to read checkpoints; the CPU wheel is
      # enough and keeps the job small. Torch is on its own index, so it installs separately.
      # mypy is here rather than in the gate step because the hook now runs it: if it were installed
      # later, the hook would fail on a missing module before reaching it.
      - name: install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pyyaml numpy safetensors ruff mypy
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      # bash is available on the Windows runner through Git, and the hook is a POSIX script.
      - name: fast gates (the commit hook's own commands)
        env:
          NINFER_PYTHON: python
        run: bash .githooks/pre-commit
