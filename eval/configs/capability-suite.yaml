schema_version: 1

targets:
  model_api:
    protocol: openai_chat
    base_url: http://127.0.0.1:18080/v1
    model: qwen3.6-27b
    # Uncomment when authentication is required.
    # api_key_env: MODEL_API_KEY
    max_concurrency: 1
    request:
      timeout_seconds: 3600
      retries: 2
      retry_interval_seconds: 10

suites:
  smoke:
    jobs:
      - id: aime25_smoke
        backend: evalscope
        dataset: aime25
        target: model_api
        limit: 2
        generation:
          temperature: 0.6
          top_p: 0.95
          max_tokens: 16384
          seed: 42
        backend_args:
          judge_strategy: rule

      - id: aime26_smoke
        backend: evalscope
        dataset: aime26
        target: model_api
        limit: 2
        generation:
          temperature: 0.6
          top_p: 0.95
          max_tokens: 16384
          seed: 42
        backend_args:
          judge_strategy: rule

      - id: gpqa_diamond_smoke
        backend: evalscope
        dataset: gpqa_diamond
        target: model_api
        limit: 2
        generation:
          temperature: 0.6
          top_p: 0.95
          max_tokens: 16384
          seed: 42

      - id: bfcl_v4_smoke
        backend: evalscope
        dataset: bfcl_v4
        target: model_api
        limit: 2
        generation:
          temperature: 0
        backend_args:
          subset_list:
            - simple_python
            - multiple
            - parallel
            - irrelevance
            - multi_turn_base
          is_fc_model: true
          underscore_to_dot: true

      # The code suite's smoke pair. The capability set above is math, science, tool-calling and
      # retrieval; the product's workload is coding, and EvalScope already carries every benchmark the
      # 2026 coding landscape names, so the gap was the configuration and not the framework.
      - id: humaneval_smoke
        backend: evalscope
        dataset: humaneval
        target: model_api
        limit: 2
        generation:
          temperature: 0.2
          top_p: 0.95
          max_tokens: 2048
          seed: 42

      - id: live_code_bench_smoke
        backend: evalscope
        dataset: live_code_bench
        target: model_api
        limit: 2
        generation:
          temperature: 0.2
          top_p: 0.95
          max_tokens: 2048
          seed: 42
        backend_args:
          allow_network_downloads: true

  reasoning:
    jobs:
      - id: aime25
        backend: evalscope
        dataset: aime25
        target: model_api
        generation:
          temperature: 0.6
          top_p: 0.95
          max_tokens: 16384
          seed: 42
        backend_args:
          judge_strategy: rule

      - id: aime26
        backend: evalscope
        dataset: aime26
        target: model_api
        generation:
          temperature: 0.6
          top_p: 0.95
          max_tokens: 16384
          seed: 42
        backend_args:
          judge_strategy: rule

      - id: gpqa_diamond
        backend: evalscope
        dataset: gpqa_diamond
        target: model_api
        generation:
          temperature: 0.6
          top_p: 0.95
          max_tokens: 16384
          seed: 42

  bfcl_full:
    jobs:
      - id: bfcl_v4
        backend: evalscope
        dataset: bfcl_v4
        target: model_api
        generation:
          temperature: 0
        backend_args:
          is_fc_model: true
          underscore_to_dot: true
          serpapi_api_key_env: SERPAPI_API_KEY
          allow_network_downloads: true

  # The code suite's own smoke, so validating it does not drag in the math and BFCL datasets.
  coding_smoke:
    jobs:
      - id: humaneval_smoke
        backend: evalscope
        dataset: humaneval
        target: model_api
        limit: 2
        generation:
          temperature: 0.2
          top_p: 0.95
          max_tokens: 2048
          seed: 42

      - id: live_code_bench_smoke
        backend: evalscope
        dataset: live_code_bench
        target: model_api
        limit: 2
        generation:
          temperature: 0.2
          top_p: 0.95
          max_tokens: 2048
          seed: 42
        backend_args:
          allow_network_downloads: true

  # A bounded version of the full coding suite. **`limit` is per subset, not per dataset**: the first run
  # asked for 40 and delivered 470 live_code_bench samples across twelve subsets in 93 minutes, so the
  # multi-subset jobs carry small limits and the single-subset one carries the real count. Measured
  # 2026-10-09 on the NVIDIA lane as it ships (fp8, DFlash2 d9): humaneval 87.5%; live_code_bench pass@1
  # 45.7% (subsets 45-50%); longbench_v2 short 31.6%, medium 35.0%, long 0% -- 17 of 19 long samples
  # refused on the engine's 262144 context cap, so that split is a context result, not a capability one.
  coding_sample:
    jobs:
      - id: humaneval_sample
        backend: evalscope
        dataset: humaneval
        target: model_api
        limit: 40
        generation:
          temperature: 0.2
          top_p: 0.95
          max_tokens: 2048
          seed: 42

      - id: live_code_bench_sample
        backend: evalscope
        dataset: live_code_bench
        target: model_api
        limit: 5
        generation:
          temperature: 0.2
          top_p: 0.95
          max_tokens: 2048
          seed: 42
        backend_args:
          allow_network_downloads: true

      - id: longbench_v2_sample
        backend: evalscope
        dataset: longbench_v2
        target: model_api
        limit: 10
        generation:
          temperature: 0
          max_tokens: 4096
          seed: 42
        backend_args:
          allow_network_downloads: true

  # What the coding landscape says to run, in one suite: LiveCodeBench for generation with a rolling
  # contamination cutoff, HumanEval as a sanity floor rather than a frontier comparison (saturated and
  # contaminated), and LongBench v2 for long-context code-repository questions. MBPP is deliberately
  # absent: the dataset refuses to run without `use_sandbox` -- measured 2026-10-09, "MBPP benchmark
  # requires sandboxed code execution for safety reasons" -- and this harness has no sandbox because its
  # targets are trusted local models; the field demotes MBPP in any case.
  # Deliberately absent: SWE-bench and Terminal-Bench, the two other names in the 2026 coding-
  # benchmark headline trio. Both are Docker harnesses -- EvalScope's adapters import
  # `DockerClient.from_env()` and build a per-instance image as the execution sandbox -- and Docker is
  # not installed on this machine, so they cannot run here at all rather than merely being heavy. They
  # also score a system rather than a model (the same model moves about 20 points on harness alone),
  # and the Windows split needed a purpose-built agent because SWE-agent, OpenHands and ClaudeCode
  # cannot run Windows containers. Installing Docker Desktop with Linux containers is the prerequisite
  # that makes swe_bench, swe_bench_pro and terminal_bench runnable; after that it is a project.
  # Sources: the 2026 consensus (SWE-bench Verified/Pro, LiveCodeBench, Terminal-Bench), EvalScope's
  # adapters in this venv, and the standing advice that a private evaluation on this repository's own
  # transcripts beats any public score.
  coding:
    jobs:
      - id: humaneval
        backend: evalscope
        dataset: humaneval
        target: model_api
        generation:
          temperature: 0.2
          top_p: 0.95
          max_tokens: 2048
          seed: 42

      - id: live_code_bench
        backend: evalscope
        dataset: live_code_bench
        target: model_api
        generation:
          temperature: 0.2
          top_p: 0.95
          max_tokens: 2048
          seed: 42
        backend_args:
          allow_network_downloads: true

      - id: longbench_v2
        backend: evalscope
        dataset: longbench_v2
        target: model_api
        generation:
          temperature: 0
          max_tokens: 4096
          seed: 42
        backend_args:
          allow_network_downloads: true

runtime:
  max_parallel_jobs: 1
  runs_dir: eval/runs
  progress:
    enabled: true
    refresh_seconds: 1
    heartbeat_seconds: 30
  samples:
    retention: all
