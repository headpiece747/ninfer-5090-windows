# Type-check the Python tooling.
#
# This code base is largely unannotated, so the useful signal is a real type error inside functions
# that do carry annotations -- not a demand for annotations everywhere, which would be a rewrite rather
# than a check. `ignore_missing_imports` keeps absent third-party stubs (torch, transformers,
# huggingface_hub) from drowning that signal, and `follow_imports = silent` stops errors in imported
# modules from being reported once per importer.
#
# Scope it at the command line rather than here:
#     python -m mypy tools/release tools/convert tests
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
show_error_codes = True
# tools/ and tests/ are packages but the repository root is not, so the same file resolves as both
# `convert.methods` and `tools.convert.methods` without this. It maps a file to the module name its
# path implies from the root, which is how the code imports itself (`from tools.convert import ...`).
explicit_package_bases = True
# tools/release/<script> puts its own directory on sys.path and then imports its neighbours by bare
# name (`from profiles import PROFILES`), which is how those scripts run standalone. mypy does not
# execute that line, so without the directory here it cannot resolve `profiles` at all and reports
# every attribute as missing -- fifteen of this backlog's errors were that single cause.
mypy_path = ., tools/release
exclude = (\.venv|build|build-test|build-asan|out|third_party|eval/\.venv)/
